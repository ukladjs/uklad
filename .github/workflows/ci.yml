name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

  typescript-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build declarations
        run: npm run build

      - name: Check with native TypeScript 7
        run: npm run typecheck && npm run test:types:package

      - name: Check with TypeScript 6 compatibility compiler
        run: npm run typecheck:compat && npm run test:types:compat

  legacy-consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ['4.9', '5.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify packed tarball (runtime smoke + TypeScript ${{ matrix.typescript }})
        run: npm run test:types:legacy -- ${{ matrix.typescript }}

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        react: ['18.3.1', '19.2.7']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install React ${{ matrix.react }}
        run: |
          if [ "${{ matrix.react }}" = "18.3.1" ]; then
            npm i -D react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7
          else
            npm i -D react@19.2.7 react-dom@19.2.7 @types/react@19.2.17 @types/react-dom@19.2.3
          fi

      - name: Build library
        run: npm run build

      - name: Run tests
        run: npm run test:ci

  package-consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Create test consumer packages
        run: |
          # Test ESM consumption
          mkdir -p test-consumption/esm-consumer
          cd test-consumption/esm-consumer
          npm init -y
          npm install ../../
          echo 'import { initAppDb, dispatch } from "@flexsurfer/reflex"; console.log("ESM import works");' > test.mjs
          node test.mjs

          # Test CommonJS consumption
          cd ../
          mkdir -p cjs-consumer
          cd cjs-consumer
          npm init -y
          npm install ../../
          echo 'const { initAppDb, dispatch } = require("@flexsurfer/reflex"); console.log("CommonJS require works");' > test.js
          node test.js

  example-todomvc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            examples/todomvc/package-lock.json

      - name: Install root dependencies (for local lib alias)
        run: npm ci

      - name: Install example dependencies
        working-directory: examples/todomvc
        run: npm ci

      - name: Build TodoMVC example
        working-directory: examples/todomvc
        run: npm run build

      - name: Lint TodoMVC example
        working-directory: examples/todomvc
        run: npm run lint

      - name: Run TodoMVC tests
        working-directory: examples/todomvc
        run: npm run test

  publish-dry-run:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Test package publication
        run: npm pack --dry-run

      - name: Test TodoMVC example build
        run: |
          cd examples/todomvc
          npm ci
          npm run build

  package-bundlers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundler: [vite, webpack, rollup, esbuild]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Pack library
        run: |
          npm pack
          mv flexsurfer-reflex-*.tgz reflex.tgz

      - name: Test with ${{ matrix.bundler }}
        run: |
          # Create test directory
          mkdir -p bundler-test
          cd bundler-test

          # Initialize consumer project
          npm init -y

          # Install peer dependencies
          npm install react@18 react-dom@18

          # Install the packed library
          npm install ../reflex.tgz

          # Create entry file that imports from the library
          cat > index.js << 'EOF'
          import { initAppDb } from "@flexsurfer/reflex";
          console.log("Successfully imported initAppDb:", typeof initAppDb);
          console.log("Library bundled successfully!");
          EOF

          # Configure bundler-specific setup and build
          if [ "${{ matrix.bundler }}" = "vite" ]; then
            npm install --save-dev vite
            cat > vite.config.js << 'EOF'
          export default {
            build: {
              lib: {
                entry: 'index.js',
                formats: ['es'],
                fileName: 'bundle'
              }
            }
          }
          EOF
            npx vite build
            test -f dist/bundle.js || test -f dist/bundle.mjs

          elif [ "${{ matrix.bundler }}" = "webpack" ]; then
            npm install --save-dev webpack webpack-cli
            cat > webpack.config.js << 'EOF'
          const path = require('path');
          module.exports = {
            entry: './index.js',
            output: {
              filename: 'bundle.js',
              path: path.resolve(__dirname, 'dist'),
              library: { type: 'commonjs2' }
            },
            mode: 'production',
            resolve: {
              extensions: ['.js']
            }
          };
          EOF
            npx webpack --mode=production
            test -f dist/bundle.js
            # Test execution of bundled output
            node dist/bundle.js

          elif [ "${{ matrix.bundler }}" = "rollup" ]; then
            npm install --save-dev rollup @rollup/plugin-node-resolve @rollup/plugin-commonjs
            cat > rollup.config.js << 'EOF'
          import { nodeResolve } from '@rollup/plugin-node-resolve';
          import commonjs from '@rollup/plugin-commonjs';

          export default {
            input: 'index.js',
            output: {
              file: 'dist/bundle.js',
              format: 'cjs'
            },
            plugins: [nodeResolve(), commonjs()]
          };
          EOF
            npx rollup -c
            test -f dist/bundle.js
            # Test execution of bundled output
            node dist/bundle.js

          elif [ "${{ matrix.bundler }}" = "esbuild" ]; then
            npm install --save-dev esbuild
            npx esbuild index.js --bundle --outfile=dist/bundle.js --format=cjs --platform=node
            test -f dist/bundle.js
            # Test execution of bundled output
            node dist/bundle.js
          fi
