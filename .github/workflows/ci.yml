name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm --filter @ukladjs/core run check

  persist-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Uklad peer
        run: pnpm run build:core

      - name: Check persistence package
        run: pnpm --filter @ukladjs/persist run check

      - name: Check packed persistence consumer
        run: pnpm --filter @ukladjs/persist run check:package

      - name: Run persistence coverage
        run: pnpm --filter @ukladjs/persist run test:ci

      - name: Verify persistence tarball
        run: npm pack --dry-run --json ./packages/persist

      - name: Check React Native and Expo fixtures
        run: >-
          pnpm --filter @ukladjs/react-native-persist-demo run check &&
          pnpm --filter @ukladjs/expo-persist-demo run check

      - name: Bundle React Native and Expo Android fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/react-native-persist"
          pnpm --filter @ukladjs/react-native-persist-demo exec react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/react-native-persist/index.android.bundle" \
            --assets-dest "$RUNNER_TEMP/react-native-persist"
          pnpm --filter @ukladjs/expo-persist-demo exec expo export \
            --platform android \
            --output-dir "$RUNNER_TEMP/expo-persist"

  tanstack-query-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Uklad peer
        run: pnpm run build:core

      - name: Check TanStack adapter
        run: pnpm --filter @ukladjs/tanstack-query run check

      - name: Run TanStack coverage
        run: pnpm --filter @ukladjs/tanstack-query run test:ci

      - name: Check packed TanStack consumer
        run: pnpm --filter @ukladjs/tanstack-query run check:package

  typescript-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build declarations
        run: pnpm --filter @ukladjs/core run build

      - name: Check with native TypeScript 7
        run: >-
          pnpm --filter @ukladjs/core run typecheck &&
          pnpm --filter @ukladjs/core run test:types:package

      - name: Check with TypeScript 6 compatibility compiler
        run: >-
          pnpm --filter @ukladjs/core run typecheck:compat &&
          pnpm --filter @ukladjs/core run test:types:compat

  legacy-consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ['4.9', '5.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @ukladjs/core run build

      - name: Verify packed tarball (runtime smoke + TypeScript ${{ matrix.typescript }})
        run: >-
          pnpm --filter @ukladjs/core run test:types:legacy
          ${{ matrix.typescript }}

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        react: ['18.3.1', '19.2.8']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install React ${{ matrix.react }}
        run: |
          if [ "${{ matrix.react }}" = "18.3.1" ]; then
            pnpm --filter @ukladjs/core add --save-dev --save-exact --lockfile=false \
              react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7
          else
            pnpm --filter @ukladjs/core add --save-dev --save-exact --lockfile=false \
              react@19.2.8 react-dom@19.2.8 @types/react@19.2.18 @types/react-dom@19.2.4
          fi

      - name: Build library
        run: pnpm --filter @ukladjs/core run build

      - name: Run tests
        run: pnpm --filter @ukladjs/core run test:ci

  package-consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @ukladjs/core run build

      - name: Pack library
        run: |
          npm pack ./packages/core
          mv ukladjs-core-*.tgz uklad.tgz

      - name: Create test consumer packages
        run: |
          # Test ESM consumption
          mkdir -p test-consumption/esm-consumer
          cd test-consumption/esm-consumer
          npm init -y
          npm install ../../uklad.tgz react@19.2.8
          cat > test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { createUkladRuntime, useSubscription } from '@ukladjs/core';
          assert.equal(typeof createUkladRuntime, 'function');
          assert.equal(typeof useSubscription, 'function');
          console.log('ESM import works');
          EOF
          node test.mjs

          # Test CommonJS consumption
          cd ../
          mkdir -p cjs-consumer
          cd cjs-consumer
          npm init -y
          npm install ../../uklad.tgz react@19.2.8
          cat > test.js <<'EOF'
          const assert = require('node:assert/strict');
          const { createUkladRuntime, useSubscription } = require('@ukladjs/core');
          assert.equal(typeof createUkladRuntime, 'function');
          assert.equal(typeof useSubscription, 'function');
          console.log('CommonJS require works');
          EOF
          node test.js

  devtools-workspaces:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DevTools stack
        run: pnpm run build:devtools && pnpm run build:mcp

      - name: Check DevTools UI
        run: pnpm --filter @ukladjs/devtools-ui run check

      - name: Run DevTools package tests
        run: pnpm --filter @ukladjs/devtools run test:unit

      - name: Run DevTools MCP tests
        run: pnpm --filter @ukladjs/devtools-mcp run test:unit

      - name: Build DevTools playground
        run: pnpm --filter @ukladjs/devtools-playground run build

      - name: Run DevTools playground tests
        run: pnpm --filter @ukladjs/devtools-playground run test

  example-todomvc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TodoMVC library dependencies
        run: pnpm run build:core && pnpm run build:persist

      - name: Build TodoMVC example
        run: pnpm --filter todomvc run build

      - name: Lint TodoMVC example
        run: pnpm --filter todomvc run lint

      - name: Run TodoMVC tests
        run: pnpm --filter todomvc run test

  example-todomvc-query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build query integration dependencies
        run: pnpm run build:core && pnpm run build:tanstack-query

      - name: Check TodoMVC Query example
        run: pnpm --filter todomvc-query run check

      - name: Build TodoMVC Query example
        run: pnpm --filter todomvc-query run build

  publish-dry-run:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        run: pnpm run build

      - name: Validate coordinated release metadata
        run: pnpm run release:validate

      - name: Inspect every public package tarball
        run: node scripts/release.mjs pack

  package-bundlers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundler: [vite, webpack, rollup, esbuild]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @ukladjs/core run build

      - name: Pack library
        run: |
          npm pack ./packages/core
          mv ukladjs-core-*.tgz uklad.tgz

      - name: Test with ${{ matrix.bundler }}
        run: |
          # Create test directory
          mkdir -p bundler-test
          cd bundler-test

          # Initialize consumer project. Pin the module type instead of relying on the
          # npm default, which differs across npm versions: bundler configs and the
          # bundled output below are CommonJS, while the entry file is .mjs.
          npm init -y
          npm pkg set type=commonjs

          # Install peer dependencies
          npm install react@18 react-dom@18

          # Install the packed library
          npm install ../uklad.tgz

          # Create entry file that imports from the library
          cat > index.mjs << 'EOF'
          import { createUkladRuntime, useSubscription } from "@ukladjs/core";
          if (typeof createUkladRuntime !== "function") {
            throw new Error("createUkladRuntime is not a function");
          }
          if (typeof useSubscription !== "function") {
            throw new Error("useSubscription is not a function");
          }
          console.log("Library bundled successfully!");
          EOF

          # Configure bundler-specific setup and build
          if [ "${{ matrix.bundler }}" = "vite" ]; then
            npm install --save-dev vite
            cat > vite.config.mjs << 'EOF'
          export default {
            build: {
              lib: {
                entry: 'index.mjs',
                formats: ['es'],
                fileName: 'bundle'
              }
            }
          }
          EOF
            npx vite build
            test -f dist/bundle.js || test -f dist/bundle.mjs

          elif [ "${{ matrix.bundler }}" = "webpack" ]; then
            npm install --save-dev webpack webpack-cli
            cat > webpack.config.js << 'EOF'
          const path = require('path');
          module.exports = {
            entry: './index.mjs',
            output: {
              filename: 'bundle.js',
              path: path.resolve(__dirname, 'dist'),
              library: { type: 'commonjs2' }
            },
            mode: 'production',
            resolve: {
              extensions: ['.mjs', '.js']
            }
          };
          EOF
            npx webpack --mode=production
            test -f dist/bundle.js
            # Test execution of bundled output
            node dist/bundle.js

          elif [ "${{ matrix.bundler }}" = "rollup" ]; then
            npm install --save-dev rollup @rollup/plugin-node-resolve @rollup/plugin-commonjs
            cat > rollup.config.mjs << 'EOF'
          import { nodeResolve } from '@rollup/plugin-node-resolve';
          import commonjs from '@rollup/plugin-commonjs';

          export default {
            input: 'index.mjs',
            output: {
              file: 'dist/bundle.js',
              format: 'cjs'
            },
            plugins: [nodeResolve(), commonjs()]
          };
          EOF
            npx rollup -c rollup.config.mjs
            test -f dist/bundle.js
            # Test execution of bundled output
            node dist/bundle.js

          elif [ "${{ matrix.bundler }}" = "esbuild" ]; then
            npm install --save-dev esbuild
            npx esbuild index.mjs --bundle --outfile=dist/bundle.js --format=cjs --platform=node
            test -f dist/bundle.js
            # Test execution of bundled output
            node dist/bundle.js
          fi
