name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm --filter @flexsurfer/reflex run check

  persist-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Reflex peer
        run: pnpm run build:reflex

      - name: Check persistence package
        run: pnpm --filter @flexsurfer/reflex-persist run check

      - name: Check packed persistence consumer
        run: pnpm --filter @flexsurfer/reflex-persist run check:package

      - name: Run persistence coverage
        run: pnpm --filter @flexsurfer/reflex-persist run test:ci

      - name: Verify persistence tarball
        run: npm pack --dry-run --json ./packages/reflex-persist

  typescript-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build declarations
        run: pnpm --filter @flexsurfer/reflex run build

      - name: Check with native TypeScript 7
        run: >-
          pnpm --filter @flexsurfer/reflex run typecheck &&
          pnpm --filter @flexsurfer/reflex run test:types:package

      - name: Check with TypeScript 6 compatibility compiler
        run: >-
          pnpm --filter @flexsurfer/reflex run typecheck:compat &&
          pnpm --filter @flexsurfer/reflex run test:types:compat

  legacy-consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ['4.9', '5.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @flexsurfer/reflex run build

      - name: Verify packed tarball (runtime smoke + TypeScript ${{ matrix.typescript }})
        run: >-
          pnpm --filter @flexsurfer/reflex run test:types:legacy --
          ${{ matrix.typescript }}

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        react: ['18.3.1', '19.2.7']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install React ${{ matrix.react }}
        run: |
          if [ "${{ matrix.react }}" = "18.3.1" ]; then
            pnpm --filter @flexsurfer/reflex add --save-dev --save-exact --lockfile=false \
              react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7
          else
            pnpm --filter @flexsurfer/reflex add --save-dev --save-exact --lockfile=false \
              react@19.2.7 react-dom@19.2.7 @types/react@19.2.17 @types/react-dom@19.2.3
          fi

      - name: Build library
        run: pnpm --filter @flexsurfer/reflex run build

      - name: Run tests
        run: pnpm --filter @flexsurfer/reflex run test:ci

  package-consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @flexsurfer/reflex run build

      - name: Pack library
        run: |
          npm pack ./packages/reflex
          mv flexsurfer-reflex-*.tgz reflex.tgz

      - name: Create test consumer packages
        run: |
          # Test ESM consumption
          mkdir -p test-consumption/esm-consumer
          cd test-consumption/esm-consumer
          npm init -y
          npm install ../../reflex.tgz react@19.2.7
          echo 'import { initState, dispatch } from "@flexsurfer/reflex"; console.log("ESM import works");' > test.mjs
          node test.mjs

          # Test CommonJS consumption
          cd ../
          mkdir -p cjs-consumer
          cd cjs-consumer
          npm init -y
          npm install ../../reflex.tgz react@19.2.7
          echo 'const { initState, dispatch } = require("@flexsurfer/reflex"); console.log("CommonJS require works");' > test.js
          node test.js

  devtools-workspaces:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DevTools stack
        run: pnpm run build:devtools && pnpm run build:mcp

      - name: Check DevTools UI
        run: pnpm --filter @flexsurfer/reflex-devtools-ui run check

      - name: Run DevTools package tests
        run: pnpm --filter @flexsurfer/reflex-devtools run test:unit

      - name: Run DevTools MCP tests
        run: pnpm --filter @flexsurfer/reflex-devtools-mcp run test:unit

      - name: Build DevTools playground
        run: pnpm --filter @flexsurfer/reflex-devtools-playground run build

  example-todomvc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TodoMVC library dependencies
        run: pnpm run build:reflex && pnpm run build:persist

      - name: Build TodoMVC example
        run: pnpm --filter todomvc run build

      - name: Lint TodoMVC example
        run: pnpm --filter todomvc run lint

      - name: Run TodoMVC tests
        run: pnpm --filter todomvc run test

  publish-dry-run:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build:reflex && pnpm run build:persist

      - name: Run tests
        run: pnpm --filter @flexsurfer/reflex run test:ci

      - name: Test package publication
        run: >-
          npm pack --dry-run ./packages/reflex &&
          npm pack --dry-run ./packages/reflex-persist &&
          npm publish --dry-run --tag beta ./packages/reflex-persist

      - name: Test TodoMVC example build
        run: pnpm --filter todomvc run build

  package-bundlers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundler: [vite, webpack, rollup, esbuild]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @flexsurfer/reflex run build

      - name: Pack library
        run: |
          npm pack ./packages/reflex
          mv flexsurfer-reflex-*.tgz reflex.tgz

      - name: Test with ${{ matrix.bundler }}
        run: |
          # Create test directory
          mkdir -p bundler-test
          cd bundler-test

          # Initialize consumer project
          npm init -y

          # Install peer dependencies
          npm install react@18 react-dom@18

          # Install the packed library
          npm install ../reflex.tgz

          # Create entry file that imports from the library
          cat > index.js << 'EOF'
          import { initState } from "@flexsurfer/reflex";
          console.log("Successfully imported initState:", typeof initState);
          console.log("Library bundled successfully!");
          EOF

          # Configure bundler-specific setup and build
          if [ "${{ matrix.bundler }}" = "vite" ]; then
            npm install --save-dev vite
            cat > vite.config.js << 'EOF'
          export default {
            build: {
              lib: {
                entry: 'index.js',
                formats: ['es'],
                fileName: 'bundle'
              }
            }
          }
          EOF
            npx vite build
            test -f dist/bundle.js || test -f dist/bundle.mjs

          elif [ "${{ matrix.bundler }}" = "webpack" ]; then
            npm install --save-dev webpack webpack-cli
            cat > webpack.config.js << 'EOF'
          const path = require('path');
          module.exports = {
            entry: './index.js',
            output: {
              filename: 'bundle.js',
              path: path.resolve(__dirname, 'dist'),
              library: { type: 'commonjs2' }
            },
            mode: 'production',
            resolve: {
              extensions: ['.js']
            }
          };
          EOF
            npx webpack --mode=production
            test -f dist/bundle.js
            # Test execution of bundled output
            node dist/bundle.js

          elif [ "${{ matrix.bundler }}" = "rollup" ]; then
            npm install --save-dev rollup @rollup/plugin-node-resolve @rollup/plugin-commonjs
            cat > rollup.config.js << 'EOF'
          import { nodeResolve } from '@rollup/plugin-node-resolve';
          import commonjs from '@rollup/plugin-commonjs';

          export default {
            input: 'index.js',
            output: {
              file: 'dist/bundle.js',
              format: 'cjs'
            },
            plugins: [nodeResolve(), commonjs()]
          };
          EOF
            npx rollup -c
            test -f dist/bundle.js
            # Test execution of bundled output
            node dist/bundle.js

          elif [ "${{ matrix.bundler }}" = "esbuild" ]; then
            npm install --save-dev esbuild
            npx esbuild index.js --bundle --outfile=dist/bundle.js --format=cjs --platform=node
            test -f dist/bundle.js
            # Test execution of bundled output
            node dist/bundle.js
          fi
